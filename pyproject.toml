[project]
name = "durparse"
version = "0.1.0"
description = "Parse duration strings to seconds and back"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
durparse = "durparse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durparse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["durparse"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__."]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
